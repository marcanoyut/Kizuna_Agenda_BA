<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ki<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: { 
          darkBg: '#0a0a0c', 
          cardBg: '#131318', 
          neonPink: '#ff2a8d', 
          neonPinkHover: '#e01c78', 
          neonBlue: '#00f0ff'
        },
        boxShadow: { 
          'neon': '0 0 15px rgba(255, 42, 141, 0.4)', 
          'neon-blue': '0 0 15px rgba(0, 240, 255, 0.4)' 
        }
      }
    }
  }

        
    </script>
    <style>
        body { font-family: sans-serif; background-color: #0a0a0c; color: #f3f4f6; }
        .neon-text-pink { text-shadow: 0 0 10px rgba(255, 42, 141, 0.8); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-darkBg min-h-screen flex flex-col justify-between">
    
    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-darkBg/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                <span class="text-3xl font-bold text-neonPink neon-text-pink">Kizuna</span>
            </div>
            <nav class="flex space-x-2">
                <button onclick="switchTab('home')" id="btn-home" class="nav-btn px-4 py-2 rounded-full text-sm bg-neonPink text-white shadow-neon">Inicio</button>
                <button onclick="switchTab('directory')" id="btn-directory" class="nav-btn px-4 py-2 rounded-full text-sm text-gray-300 hover:bg-white/5">Directorio</button>
                <button onclick="switchTab('map')" id="btn-map" class="nav-btn px-4 py-2 rounded-full text-sm text-gray-300 hover:bg-white/5">Mapa</button>
                <button onclick="switchTab('apply')" id="btn-apply" class="nav-btn px-4 py-2 rounded-full text-sm text-gray-300 hover:bg-white/5">Postulación</button>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO INTERACTIVO -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        
        <!-- VISTA: INICIO -->
        <div id="tab-home" class="tab-content active space-y-8 text-center py-12">
            <h1 class="text-5xl font-bold text-white">Cultura Japonesa en <span class="text-neonPink neon-text-pink">Buenos Aires</span></h1>
            <p class="text-gray-400 max-w-2xl mx-auto">Un prototipo interactivo para conectar la gastronomía, arte y eventos inspirados en Japón.</p>
            <button onclick="switchTab('directory')" class="px-6 py-3 bg-neonPink text-white rounded-full shadow-neon">Explorar Directorio</button>
        </div>

        <!-- VISTA: DIRECTORIO -->
        <div id="tab-directory" class="tab-content space-y-6">
            <h2 class="text-2xl font-bold text-white border-l-4 border-neonPink pl-3">Directorio Gastronómico y Cultural</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-cardBg p-5 rounded-xl border border-white/5">
                    <span class="text-xs text-neonPink font-semibold uppercase tracking-wider">Gastronomía</span>
                    <h3 class="text-xl font-bold text-white mt-1">Fuji Ramen Bar</h3>
                    <p class="text-gray-400 text-sm mt-2">Especialistas en Hakata Tonkotsu y caldos artesanales en Palermo.</p>
                </div>
                <div class="bg-cardBg p-5 rounded-xl border border-white/5">
                    <span class="text-xs text-neonBlue font-semibold uppercase tracking-wider">Cultura</span>
                    <h3 class="text-xl font-bold text-white mt-1">Centro Sakura</h3>
                    <p class="text-gray-400 text-sm mt-2">Talleres estacionales de caligrafía, idioma japonés y Origami en Almagro.</p>
                </div>
            </div>
        </div>

        <!-- VISTA: MAPA -->
        <div id="tab-map" class="tab-content space-y-4">
            <h2 class="text-2xl font-bold text-white border-l-4 border-neonBlue pl-3">Mapa de Puntos de Interés</h2>
            <div class="bg-cardBg h-64 rounded-xl border border-white/5 flex items-center justify-center text-gray-500">
                <p>[Simulación de Mapa de Buenos Aires para el Cliente]</p>
            </div>
        </div>

        <!-- VISTA: POSTULACIÓN -->
        <div id="tab-apply" class="tab-content space-y-6">
            <h2 class="text-2xl font-bold text-white border-l-4 border-neonPink pl-3">Postular Emprendimiento</h2>
            <form id="apply-form" onsubmit="handleFormSubmit(event)" class="space-y-4 max-w-xl bg-cardBg p-6 rounded-xl border border-white/5">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nombre del Comercio</label>
                    <input type="text" required class="w-full bg-darkBg border border-white/10 rounded-lg p-2.5 text-white focus:border-neonPink focus:outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-neonPink hover:bg-neonPinkHover text-white font-medium rounded-lg shadow-neon transition-colors">Enviar Registro</button>
            </form>
            <div id="success-feedback" class="hidden p-6 bg-emerald-950/50 border border-emerald-500 rounded-xl text-center space-y-3">
                <p class="text-emerald-400 font-medium">¡Postulación enviada correctamente!</p>
                <button onclick="resetFormView()" class="text-xs text-gray-400 underline">Enviar otra respuesta</button>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-white/5 py-6 text-center text-xs text-gray-600">
        &copy; 2026 Kizuna BA. Prototipo Funcional.
    </footer>

    <!-- LÓGICA INTERACTIVA -->
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-neonPink', 'text-white', 'shadow-neon');
                b.classList.add('text-gray-300', 'hover:bg-white/5');
            });
            document.getElementById(`tab-${tabId}`).classList.add('active');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-300', 'hover:bg-white/5');
                activeBtn.classList.add('bg-neonPink', 'text-white', 'shadow-neon');
            }
        }
        function handleFormSubmit(e) {
            e.preventDefault();
            document.getElementById('apply-form').classList.add('hidden');
            document.getElementById('success-feedback').classList.remove('hidden');
        }
        function resetFormView() {
            document.getElementById('apply-form').reset();
            document.getElementById('success-feedback').classList.add('hidden');
            document.getElementById('apply-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
